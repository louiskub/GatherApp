<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup Notification</title>
    <link rel="stylesheet" href="/wwwroot/css/src.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!DOCTYPE html>
    <html lang="en">
    <style>
        :root {
            --bg-color: var(--lavender-blush);
            --text-color: var(--eerie-black);
            --header-bg: var(--bright-pink-crayola);
            --header-text: var(--seasalt);
            --noti-bg: var(--seasalt);
            --noti-border: var(--french-gray);
            --important-bg: var(--rose-red);

            --icon-color: var(--eerie-black);
            --inform-icon-bg: var(--cherry-blossom-pink);
            --post-icon-bg: var(--salmon-pink);
        }
        
        [data-theme="dark"] {
            --bg-color: var(--outer-space);
            --text-color: var(--seasalt);
            --header-bg: var(--claret);
            --header-text: var(--antiflash-white);
            --noti-bg: var(--eerie-black);
            --noti-border: var(--slate-gray);
            --important-bg: var(--chocolate-cosmos);

            --icon-color: white;
            --inform-icon-bg: var(--amaranth-purple);
            --post-icon-bg: var(--rose-red);
        }
        
        body {
            font-family: Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .notification-container {
            position: fixed;
            top: 80px;
            right: 20px;
            width: 90%;
            max-width: 350px;
            background: var(--noti-bg);
            border: 1px solid var(--noti-border);
            box-shadow: 4px 4px 15px rgba(0,0,0,0.3);
            border-radius: 12px;
            overflow: hidden;
            display: none;
        }
        .noti-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--header-bg);
            color: var(--header-text);
            padding: 15px;
            font-weight: bold;
        }
        .filter-notifications {
            display: flex;
            justify-content: space-around;
            gap: 7px;
            padding: 5px;
            border-bottom: 1px solid var(--noti-border);
            border-top: 1px solid var(--noti-border);
        }
        .filter-notifications button {
            background: var(--amaranth-purple);
            color: var(--seasalt);
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
            width: 80%;
        }
        .filter-notifications button:hover {
            background: var(--bright-pink-crayola-2);
        }
        .noti-list {
            max-height: 250px;
            overflow-y: auto;
        }
        .noti-item {
            padding: 15px;
            border-bottom: 1px solid var(--noti-border);
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            transition: 0.3s;
        }
        .noti-item:hover {
            background: var(--platinum);
        }
        .noti-item .icon {
            font-size: 20px;
            background: var(--header-bg);
            padding: 0.5rem;
            border-radius: 50%;
            color: var(--icon-color);
        }
        .noti-item.inform .icon{
            background: var(--inform-icon-bg);
        }
        .noti-item.post .icon{
            background: var(--post-icon-bg);
        }
        .noti-time {
            position: absolute;
            right: 15px;
            font-size: 12px;
            color: var(--text-color);
            opacity: 0.6;
        }
        .noti {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 18px;
            background: var(--header-bg);
            color: var(--header-text);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
        }
        .noti:hover {
            background: var(--bright-pink-crayola-2);
        }
        @media (max-width: 480px) {
            .notification-container {
                width: 95%;
                right: 2.5%;
            }
            .filter-notifications {
                flex-direction: column;
                align-items: center;
            }
            .filter-notifications button {
                width: 100%;
                margin-top: 5px;
            }
        }
    </style>
</head>
<body data-theme="dark">
    <button class="noti">Toggle Notifications</button>
    <div class="notification-container" id="notificationContainer">
        <div class="noti-header">
            <span>Notifications</span>
        </div>
        <div class="filter-notifications">
            <button class="filter-all">All</button>
            <button class="filter-inform">Inform</button>
            <button class="filter-post">Post</button>
        </div>
        <div class="noti-list" id="notiList">
            <div class="noti-item inform" data-type="report">
                <i class="fa-solid fa-triangle-exclamation icon"></i>
                <span>Report Notification</span>
                <span class="noti-time">10:30 AM</span>
            </div>
            <div class="noti-item inform" data-type="review">
                <i class="fa-solid fa-magnifying-glass icon"></i>
                <span>Review Notification</span>
                <span class="noti-time">10:45 AM</span>
            </div>
            <div class="noti-item post" data-type="approved">
                <i class="fa-solid fa-circle-check icon"></i>
                <span>Post Approved</span>
                <span class="noti-time">11:00 AM</span>
            </div>
            <div class="noti-item post" data-type="rejected">
                <i class="fa-solid fa-circle-xmark icon"></i>
                <span>Post Rejected</span>
                <span class="noti-time">11:15 AM</span>
            </div>
            <div class="noti-item post" data-type="apply post">
                <i class="fa-solid fa-envelope icon"></i>
                <span>Apply Post</span>
                <span class="noti-time">11:30 AM</span>
            </div>
        </div>
    </div>
    
    <script>
        function toggleNotifications() {
            const container = document.getElementById('notificationContainer');
            container.style.display = container.style.display === 'none' || container.style.display === '' ? 'block' : 'none';
        }

        function filterNotifications(type) {
            const notifications = document.querySelectorAll('.noti-item');
            notifications.forEach(noti => {
                if (type === 'all' || noti.classList.contains(type)) {
                    noti.style.display = 'flex';
                } else {
                    noti.style.display = 'none';
                }
            });
        }

        const noti = document.querySelector('.noti');
        noti.addEventListener('click', toggleNotifications);

        const filterAll = document.querySelector('.filter-all');
        const filterInform = document.querySelector('.filter-inform');
        const filterPost = document.querySelector('.filter-post');
        filterAll.addEventListener('click', () => filterNotifications('all'));
        filterInform.addEventListener('click', () => filterNotifications('inform'));
        filterPost.addEventListener('click', () => filterNotifications('post'));

    </script>
</body>
</html>
