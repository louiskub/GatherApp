<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Notification System</title>
    <link rel="stylesheet" href="/wwwroot/css/src.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {

            /* Light Theme Variables */
            --bg-color: var(--antiflash-white);
            --text-color: var(--eerie-black);
            --header-bg: var(--bright-pink-crayola);
            --header-text: var(--seasalt);
            --noti-bg: var(--seasalt);
            --noti-border: var(--french-gray);
            --noti-hover: var(--platinum);
            --button-bg: transparent;
            --button-hover: var(--pink);
            --button-text: var(--slate-gray);
            --button-active-text: var(--eerie-black);
            --toggle-bg: var(--bright-pink-crayola);
            --toggle-hover: var(--bright-pink-crayola-2);
            --toggle-text: var(--seasalt);
            
            --icon-color: var(--seasalt);
            --inform-icon-bg: var(--cherry-blossom-pink);
            --post-icon-bg: var(--salmon-pink);
            --report-icon-bg: var(--rose-red);
            --approved-icon-bg: var(--nyanza);
            --rejected-icon-bg: var(--bright-pink-crayola);
            --apply-icon-bg: var(--uranian-blue);
            
            --time-color: var(--slate-gray);
            --shadow-color: rgba(0, 0, 0, 0.15);
            --filter-active: var(--bright-pink-crayola);
            --filter-indicator: var(--bright-pink-crayola);
        }

        [data-theme="dark"] {
            --bg-color: var(--onyx);
            --text-color: var(--seasalt);
            --header-bg: var(--claret);
            --header-text: var(--antiflash-white);
            --noti-bg: var(--eerie-black);
            --noti-border: var(--slate-gray);
            --noti-hover: var(--outer-space);
            --button-bg: transparent;
            --button-hover: var(--amaranth-purple);
            --button-text: var(--french-gray);
            --button-active-text: var(--seasalt);
            --toggle-bg: var(--claret);
            --toggle-hover: var(--amaranth-purple);
            --toggle-text: var(--seasalt);
            
            --icon-color: var(--seasalt);
            --inform-icon-bg: var(--amaranth-purple);
            --post-icon-bg: var(--rose-red);
            --report-icon-bg: var(--chocolate-cosmos);
            --approved-icon-bg: var(--nyanza);
            --rejected-icon-bg: var(--bright-pink-crayola);
            --apply-icon-bg: var(--uranian-blue);
            
            --time-color: var(--french-gray-2);
            --shadow-color: rgba(0, 0, 0, 0.4);
            --filter-active: var(--bright-pink-crayola);
            --filter-indicator: var(--bright-pink-crayola);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 1000;
        }

        .theme-toggle, .noti-toggle {
            padding: 12px 18px;
            background-color: var(--toggle-bg);
            color: var(--toggle-text);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px var(--shadow-color);
            transition: all 0.3s ease;
        }

        .theme-toggle:hover, .noti-toggle:hover {
            background-color: var(--toggle-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px var(--shadow-color);
        }

        .theme-toggle:active, .noti-toggle:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px var(--shadow-color);
        }

        .notification-container {
            position: fixed;
            top: 80px;
            right: 20px;
            width: 90%;
            max-width: 380px;
            background-color: var(--noti-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px var(--shadow-color);
            opacity: 0;
            transform: translateY(-20px) scale(0.95);
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 1000;
        }

        .notification-container.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: all;
        }

        .noti-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 18px 20px;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 2px 10px var(--shadow-color);
        }

        .noti-header .badge {
            background-color: var(--seasalt);
            color: var(--header-bg);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        /* New modern filter styles */
        .filter-container {
            position: relative;
            padding: 20px 20px 10px;
            display: flex;
            flex-direction: column;
        }

        .filter-label {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--button-text);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-label i {
            font-size: 10px;
        }

        .filter-notifications {
            display: flex;
            position: relative;
            background-color: var(--noti-bg);
            border-radius: 30px;
            padding: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            z-index: 1;
        }

        .filter-slider {
            position: absolute;
            height: calc(100% - 8px);
            border-radius: 30px;
            background-color: var(--filter-indicator);
            top: 4px;
            left: 4px;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: -1;
        }

        .filter-notifications button {
            background-color: transparent;
            color: var(--button-text);
            border: none;
            padding: 8px 0;
            cursor: pointer;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
            flex: 1;
            position: relative;
            z-index: 2;
        }

        .filter-notifications button:hover {
            color: var(--button-active-text);
        }

        .filter-notifications button.active {
            color: var(--seasalt);
        }

        .noti-list {
            max-height: 400px;
            overflow-y: auto;
            padding: 8px 0;
            scrollbar-width: thin;
            scrollbar-color: var(--french-gray-2) transparent;
        }

        .noti-list::-webkit-scrollbar {
            width: 6px;
        }

        .noti-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .noti-list::-webkit-scrollbar-thumb {
            background-color: var(--french-gray-2);
            border-radius: 6px;
        }

        .noti-item {
            padding: 16px 20px;
            margin: 6px 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            transition: all 0.2s ease;
            background-color: var(--noti-bg);
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .noti-item:hover {
            background-color: var(--noti-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow-color);
        }

        .noti-item .icon {
            font-size: 16px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: var(--icon-color);
            flex-shrink: 0;
        }

        .noti-item.inform .icon {
            background-color: var(--inform-icon-bg);
        }

        .noti-item.post .icon {
            background-color: var(--post-icon-bg);
        }

        .noti-item[data-type="report"] .icon {
            background-color: var(--report-icon-bg);
        }

        .noti-item[data-type="approved"] .icon {
            background-color: var(--approved-icon-bg);
            color: var(--eerie-black);
        }

        .noti-item[data-type="rejected"] .icon {
            background-color: var(--rejected-icon-bg);
        }

        .noti-item[data-type="apply post"] .icon {
            background-color: var(--apply-icon-bg);
            color: var(--eerie-black);
        }

        .noti-content {
            flex-grow: 1;
        }

        .noti-title {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 14px;
        }

        .noti-message {
            font-size: 13px;
            opacity: 0.8;
            line-height: 1.4;
        }

        .noti-time {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 12px;
            color: var(--time-color);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .noti-time i {
            font-size: 10px;
        }

        .empty-state {
            padding: 30px 20px;
            text-align: center;
            color: var(--time-color);
            font-size: 14px;
            display: none;
        }

        .empty-state i {
            font-size: 40px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        @media (max-width: 480px) {
            .notification-container {
                width: 95%;
                right: 2.5%;
                max-width: none;
            }

            .controls {
                top: 10px;
                right: 10px;
                gap: 8px;
            }

            .theme-toggle, .noti-toggle {
                padding: 10px 14px;
                font-size: 13px;
            }

            .filter-container {
                padding: 15px 15px 8px;
            }

            .filter-notifications {
                padding: 3px;
            }

            .filter-notifications button {
                font-size: 12px;
                padding: 7px 0;
            }
        }

        /* New styles for Show More/Less functionality */
        .show-more-container {
            text-align: center;
            padding: 10px 0;
        }

        .show-more-btn {
            background-color: transparent;
            border: none;
            color: var(--button-text);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .show-more-btn:hover {
            background-color: var(--button-hover);
            color: var(--button-active-text);
        }

        .show-more-btn i {
            margin-left: 5px;
            transition: transform 0.3s ease;
        }

        .show-more-btn.expanded i {
            transform: rotate(180deg);
        }

        .noti-item.hidden {
            display: none;
        }
    </style>
</head>
<body>

    <script type="module">

    import { Notification, renderNotifications } from '/wwwroot/js/components/notification.js';

// DOM Elements
const themeToggle = document.querySelector('.theme-toggle');
const notiToggle = document.querySelector('.noti-toggle');
const notificationContainer = document.getElementById('notificationContainer');
const filterButtons = document.querySelectorAll('.filter-notifications button');
const filterSlider = document.getElementById('filterSlider');
const emptyState = document.getElementById('emptyState');
const showMoreBtn = document.getElementById('showMoreBtn');
const notiList = document.getElementById('notiList');
const badge = document.querySelector('.noti-header .badge');

let isExpanded = false;

const notifications = [
        { type: "report", title: "Report Notification", message: "Your report has been received and is being reviewed.", time: "10:30 AM" },
        { type: "review", title: "Review Notification", message: "Your content is being reviewed by our team.", time: "10:45 AM" },
        { type: "approved", title: "Post Approved", message: "Your post has been approved and is now live.", time: "11:00 AM" },
        { type: "rejected", title: "Post Rejected", message: "Your post was rejected. Please review our guidelines.", time: "11:15 AM" },
        { type: "apply post", title: "Apply Post", message: "Your application has been submitted successfully.", time: "11:30 AM" },
        { type: "update", title: "System Update", message: "A new system update is available. Please review the changes.", time: "12:00 PM" },
        { type: "comment", title: "New Comment", message: "Someone commented on your recent post.", time: "12:30 PM" }
    ];

renderNotifications(notiList, notifications);

// อัปเดตค่า notiItems ใหม่
let notiItems = [...document.querySelectorAll('.noti-item')];

// อัปเดตตำแหน่งของ Filter Slider
const updateFilterSlider = () => {
    const activeButton = document.querySelector('.filter-notifications button.active');
    if (activeButton) {
        filterSlider.style.width = `${activeButton.offsetWidth}px`;
        filterSlider.style.transform = `translateX(${activeButton.offsetLeft}px)`;
    }
};

// สลับธีม Light/Dark Mode
themeToggle.addEventListener('click', () => {
    const newTheme = document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    document.body.setAttribute('data-theme', newTheme);
    themeToggle.innerHTML = newTheme === 'dark' ? '<i class="fas fa-sun"></i><span>Light Mode</span>' : '<i class="fas fa-moon"></i><span>Dark Mode</span>';
    localStorage.setItem('theme', newTheme);
});

// โหลดธีมที่บันทึกไว้
const savedTheme = localStorage.getItem('theme');
if (savedTheme) {
    document.body.setAttribute('data-theme', savedTheme);
    if (savedTheme === 'dark') {
        themeToggle.innerHTML = '<i class="fas fa-sun"></i><span>Light Mode</span>';
    }
}

// เปิด/ปิดการแจ้งเตือน
notiToggle.addEventListener('click', () => notificationContainer.classList.toggle('show'));

// ปิดการแจ้งเตือนเมื่อคลิกข้างนอก
document.addEventListener('click', (event) => {
    if (!notificationContainer.contains(event.target) && !notiToggle.contains(event.target)) {
        notificationContainer.classList.remove('show');
    }
});

// กรองการแจ้งเตือน
const filterNotifications = (filterType) => {
    let visibleCount = 0;

    notiItems.forEach(item => {
        if (filterType === 'all' || item.classList.contains(filterType)) {
            item.style.display = 'flex';
            visibleCount++;
        } else {
            item.style.display = 'none';
        }
    });
    emptyState.style.display = visibleCount === 0 ? 'block' : 'none';

    updateBadge();
    updateShowMoreButtonVisibility();
    resetShowMore();
};

// จัดการคลิกปุ่มกรอง
filterButtons.forEach((button, index) => {
    button.dataset.index = index;
    button.addEventListener('click', () => {
        filterButtons.forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        updateFilterSlider();
        filterNotifications(button.classList[0].replace('filter-', ''));
    });
});

// อัปเดตจำนวนแจ้งเตือนที่มองเห็นได้
const updateBadge = () => {
    const visibleItems = notiItems.filter(item => item.style.display !== 'none');
    badge.textContent = visibleItems.length;
};

// จัดการแสดง Show More / Show Less
const toggleNotifications = () => {
    const visibleItems = notiItems.filter(item => item.style.display !== 'none');

    if (isExpanded) {
        // แสดงเฉพาะ 5 อันแรก
        visibleItems.forEach((item, index) => {
            item.style.display = index < 5 ? 'flex' : 'none';
        });
        showMoreBtn.innerHTML = 'Show More <i class="fas fa-chevron-down"></i>';
    } else {
        // แสดงทั้งหมด
        notiItems.forEach(item => {
            if (item.style.display !== 'none') {
                item.style.display = 'flex';
            }
        });
        showMoreBtn.innerHTML = 'Show Less <i class="fas fa-chevron-up"></i>';
    }

    isExpanded = !isExpanded;
};

// รีเซ็ตปุ่ม Show More เมื่อเปลี่ยน filter
const resetShowMore = () => {
    isExpanded = false;
    showMoreBtn.innerHTML = 'Show More <i class="fas fa-chevron-down"></i>';
    toggleNotifications();
};

// ตรวจสอบว่าต้องแสดงปุ่ม Show More หรือไม่
const updateShowMoreButtonVisibility = () => {
    const visibleItems = notiItems.filter(item => item.style.display !== 'none');
    showMoreBtn.style.display = visibleItems.length > 5 ? 'inline-block' : 'none';
};

// กดปุ่ม Show More/Less
showMoreBtn.addEventListener('click', toggleNotifications);

// ตั้งค่าเริ่มต้นเมื่อโหลดหน้า
window.addEventListener('load', () => {
    updateFilterSlider();
    filterNotifications('all');
    updateBadge();
    updateShowMoreButtonVisibility();
});

// ปรับขนาด Slider เมื่อหน้าต่างเปลี่ยนขนาด
let resizeTimeout;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(updateFilterSlider, 100);
});

    </script>
